name: Challenge a claim
description: Report a factual error, a missing piece of prior work, or counterevidence.
title: "[Challenge] "
labels: ["challenge"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Challenges are the fastest way to find out whether these ideas hold up. Specific, sourced challenges are the most useful.
  - type: input
    id: section
    attributes:
      label: Section or proposal
      description: Which part of the white paper does this concern?
      placeholder: "e.g., Diagnosis #2, Proposal 1, Figure 2"
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: The claim
      description: Quote or summarize the statement you're challenging.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of challenge
      options:
        - Factual error or wrong number
        - Missing or misdescribed prior work
        - Logical flaw in the argument
        - Counterevidence from experiments or production
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Explain the problem and link sources, papers, or data where possible.
    validations:
      required: true
