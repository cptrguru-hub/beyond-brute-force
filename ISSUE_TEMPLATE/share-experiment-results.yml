name: Share experiment results
description: Report results from testing any of the proposals, whether they support or refute them.
title: "[Results] "
labels: ["results"]
body:
  - type: markdown
    attributes:
      value: |
        Results in either direction are valuable. Negative results are just as welcome as positive ones.
  - type: dropdown
    id: experiment
    attributes:
      label: Which experiment or proposal?
      options:
        - "Experiment 1: expert working sets in an open MoE model"
        - "Experiment 2: semantic hierarchical output layer"
        - "Experiment 3: tiered inference with guards"
        - "Proposal 4: memory-only knowledge updates"
        - "Proposal 5: precision loss by discipline"
        - Other
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Model(s), dataset or prompts, hardware, and key settings.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: What you measured and what you found. Charts and tables welcome.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Does this support or refute the proposal?
      options:
        - Supports
        - Refutes
        - Mixed or inconclusive
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Code or data link (optional)
      placeholder: "https://..."
